<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Carousel Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#050810;
    --bg-soft:#0a0f1c;
    --accent-1:#3D8BFD;
    --accent-2:#22D3EE;
    --grad:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    --white:#ffffff;
    --dim:rgba(255,255,255,.62);
    --dim-2:rgba(255,255,255,.38);
    --hair:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#0c0f14;color:var(--white);font-family:'DM Sans',sans-serif;}

  /* ---------- toolbar (not exported) ---------- */
  .toolbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:16px 24px;background:rgba(5,8,16,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hair);
  }
  .toolbar h1{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;margin-right:auto;}
  .toolbar h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .btn{
    font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;
    color:var(--white);background:transparent;border:1px solid var(--hair);border-radius:8px;
    padding:10px 16px;cursor:pointer;transition:.15s ease;
  }
  .btn:hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.05);}
  .btn.primary{background:var(--grad);border:none;color:#04101c;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  #status{font-size:12px;color:var(--dim);min-width:110px;}

  /* ---------- stage / preview scaling shell ---------- */
  .stage{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 20px 120px;}
  .frame{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);}
  .frame-label{font-size:12px;color:var(--dim-2);letter-spacing:.08em;text-transform:uppercase;}

  /* =====================================================
     SLIDE — fixed 1080x1350 export canvas. Do not scale
     this element directly; the .frame wrapper handles the
     on-screen preview scale via transform on this node's
     absolute-positioned box, so offsetWidth/Height (what
     html2canvas measures) always stays native 1080x1350.
  ===================================================== */
  .slide{
    position:absolute;top:0;left:0;
    width:1080px;height:1350px;
    background:var(--bg);
    color:var(--white);
    overflow:hidden;
    transform-origin:0 0;
    font-family:'DM Sans',sans-serif;
  }
  .slide::before{ /* faint dot grid texture */
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(ellipse 90% 70% at 50% 40%,#000 40%,transparent 100%);
  }
  .rail{position:absolute;top:0;left:0;width:9px;height:100%;background:var(--grad);}
  .rail.right{left:auto;right:0;}

  .ghost-num{
    position:absolute;font-family:'Playfair Display',serif;font-weight:900;
    font-size:400px;line-height:1;color:rgba(255,255,255,.045);
    letter-spacing:-.02em;pointer-events:none;user-select:none;
  }

  .kicker{
    display:inline-flex;align-items:center;gap:12px;
    font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  }
  .kicker::before{content:"";width:34px;height:5px;border-radius:3px;background:var(--grad);display:block;}

  .eyebrow-vert{
    position:absolute;left:56px;top:50%;
    writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);
    font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--dim-2);
  }

  /* solid (not gradient-clipped) accent color: html2canvas cannot rasterize
     background-clip:text reliably, so emphasis words use a flat accent color */
  .accent-text{color:var(--accent-2);}

  .headline{font-family:'Playfair Display',serif;font-weight:800;line-height:1.04;letter-spacing:-.01em;}
  .body-text{font-family:'DM Sans',sans-serif;color:var(--dim);font-weight:400;}

  .footer{
    position:absolute;left:100px;right:100px;bottom:56px;
    display:flex;align-items:center;justify-content:space-between;
    padding-top:22px;border-top:1px solid var(--hair);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:22px;height:22px;border-radius:7px;background:var(--grad);flex-shrink:0;}
  .brand-name{font-size:15px;font-weight:700;color:var(--white);}
  .brand-role{font-size:14px;color:var(--dim-2);margin-left:6px;}
  .slide-count{font-size:14px;color:var(--dim-2);font-variant-numeric:tabular-nums;}

  /* ---------- cover slide ---------- */
  .s-cover .cover-inner{position:absolute;left:100px;right:100px;top:150px;bottom:170px;}
  .s-cover .ghost-num{top:-40px;right:-30px;}
  .s-cover .headline{font-size:112px;max-width:840px;margin-top:56px;}
  .s-cover .sub{
    position:absolute;right:0;bottom:0;max-width:430px;text-align:left;
    font-size:26px;line-height:1.5;color:var(--dim);
  }
  .s-cover .swipe{
    position:absolute;left:0;bottom:0;font-size:16px;font-weight:700;letter-spacing:.04em;
    display:flex;align-items:center;gap:10px;color:var(--white);
  }
  .s-cover .swipe .arrow{
    width:40px;height:2px;background:var(--grad);position:relative;
  }
  .s-cover .swipe .arrow::after{
    content:"";position:absolute;right:0;top:50%;width:9px;height:9px;border-right:2px solid var(--accent-2);
    border-top:2px solid var(--accent-2);transform:translateY(-50%) rotate(45deg);
  }

  /* ---------- content slide (asymmetric, alternating) ---------- */
  .s-content .content-inner{position:absolute;left:100px;right:100px;top:132px;bottom:170px;}
  .s-content .ghost-num{top:64px;font-size:340px;}
  .s-content.odd .ghost-num{left:-20px;}
  .s-content.even .ghost-num{right:-20px;text-align:right;}
  .s-content .num-tag{
    display:inline-block;font-family:'Playfair Display',serif;font-weight:700;font-size:22px;
    color:var(--accent-2);margin-bottom:22px;
  }
  .s-content .headline{font-size:76px;max-width:660px;margin-top:250px;}
  .s-content.even .headline{margin-left:auto;text-align:left;}
  .divider{width:64px;height:4px;border-radius:2px;background:var(--grad);margin:34px 0;}
  .s-content.even .divider{margin-left:auto;}
  .s-content .body-text{font-size:29px;line-height:1.55;max-width:600px;}
  .s-content.even .body-text{margin-left:auto;text-align:left;}
  .callout{
    margin-top:30px;padding:22px 26px;max-width:560px;border-left:3px solid var(--accent-2);
    background:rgba(61,139,253,.07);border-radius:0 10px 10px 0;
  }
  .s-content.even .callout{margin-left:auto;border-left:none;border-right:3px solid var(--accent-2);border-radius:10px 0 0 10px;}
  .callout p{font-family:'Playfair Display',serif;font-style:italic;font-size:24px;line-height:1.4;color:var(--white);}

  /* ---------- CTA slide ---------- */
  .s-cta{background:var(--bg);}
  .s-cta .blob{
    position:absolute;left:0;right:0;bottom:0;height:32%;
    background:var(--grad);
    clip-path:polygon(0 62%,100% 0,100% 100%,0 100%);
  }
  .s-cta .cta-inner{position:absolute;left:100px;right:100px;top:190px;}
  .s-cta .headline{font-size:96px;max-width:760px;}
  .s-cta .body-text{font-size:28px;line-height:1.55;max-width:560px;margin-top:34px;color:var(--dim);}
  /* plain solid border — html2canvas rasterizes multi-layer background-clip
     border tricks (and nested flex+radius combos) unreliably */
  .s-cta .handle-pill{
    display:inline-block;margin-top:56px;padding:16px 28px;
    border-radius:999px;border:2px solid var(--accent-2);background:rgba(255,255,255,.03);
    font-size:22px;font-weight:700;
  }
  .s-cta .action-line{margin-top:26px;font-size:17px;font-weight:700;letter-spacing:.05em;color:var(--dim-2);text-transform:uppercase;}
  /* solid scrim so footer text stays legible over the gradient blob */
  .s-cta .footer{background:rgba(5,8,16,.7);border-radius:12px;padding:22px 24px;border-top:none;left:70px;right:70px;bottom:44px;}
</style>
</head>
<body>

<!-- =========================================================
     1. CONTENT — edit this array to swap every slide's copy.
     type: "cover" | "content" | "cta"
     Use "\n" for manual line breaks and *word* to render a
     gradient-accent span inside a headline or sub/body string.
========================================================= -->
<script>
const BRAND = {
  name: "Kishan Kr Soni",
  role: "Content Strategist",
};

const SLIDES = [
  {
    type: "cover",
    kicker: "The Carousel Playbook",
    headline: "Nobody reads\nyour carousel.\nThey *scan* it.",
    sub: "Six uncomfortable rules for slides people actually stop scrolling for.",
    swipe: "Swipe for the rules",
  },
  {
    type: "content",
    num: "01",
    tag: "Rule One",
    headline: "One slide.\nOne idea.\nAlways.",
    body: "The moment a slide is explaining two things, the thumb is already moving. If you can't summarize a slide in five words, it isn't one slide — it's two, and you haven't written the second one yet.",
    callout: "Cut it in half. Then check again.",
  },
  {
    type: "content",
    num: "02",
    tag: "Rule Two",
    headline: "Write the\nheadline first.\nDesign second.",
    body: "Design is not lipstick on a weak idea. If the headline alone can't earn a stop mid-scroll, no gradient or grid will save it. Draft every headline in a plain text file before you open a design tool.",
    callout: "If it's boring in Notepad, it's boring in Figma.",
  },
  {
    type: "content",
    num: "03",
    tag: "Rule Three",
    headline: "Kill the\nbullet points.",
    body: "Bullets signal a list to skim, not an idea to absorb. One sentence, set big, does more work than five fragments stacked in a row. Say the thing, then stop.",
    callout: "A slide is a sentence, not a spreadsheet.",
  },
  {
    type: "content",
    num: "04",
    tag: "Rule Four",
    headline: "Contrast is\nthe whole game.",
    body: "Size contrast, color contrast, spacing contrast — it's what makes a scrolling thumb register 'something changed here.' A deck where every slide looks the same reads as one long gray wall.",
    callout: "If every slide could be slide one, none of them are.",
  },
  {
    type: "content",
    num: "05",
    tag: "Rule Five",
    headline: "Leave room\nto breathe.",
    body: "Empty space isn't wasted space — it's what tells the eye where to land first. Cramming in one more line always feels safer than cutting one, and it's always the wrong call.",
    callout: "Whitespace is a design decision, not a leftover.",
  },
  {
    type: "content",
    num: "06",
    tag: "Rule Six",
    headline: "The last slide\nis doing\nnothing.",
    body: "Most carousels end on a recap nobody asked for. The final slide is the only guaranteed second impression you get — a clear ask beats a polite summary every time.",
    callout: "End with an instruction, not a conclusion.",
  },
  {
    type: "cta",
    headline: "Save this.\nThen rebuild\nyour last one.",
    body: "Pick one rule above and apply it to the next carousel you publish. Small edits compound fast.",
    handle: "@kishankrsoni",
    action: "Follow for the next playbook",
  },
];
</script>

<div class="toolbar">
  <h1>Carousel <span>Generator</span></h1>
  <span id="status">Slides ready</span>
  <button class="btn" id="btn-export-current">Download Current PNG</button>
  <button class="btn" id="btn-export-all">Download All (Individual)</button>
  <button class="btn primary" id="btn-export-zip">Download All (ZIP)</button>
</div>

<div class="stage" id="stage"></div>

<script>
/* ---------------------------------------------------------
   2. RENDER — builds one .slide div per SLIDES entry.
--------------------------------------------------------- */
function fmt(str){
  if(!str) return "";
  return String(str)
    .split("\n").join("<br>")
    .replace(/\*(.+?)\*/g, '<span class="accent-text">$1</span>');
}

function footerHTML(current, total){
  return `
    <div class="footer">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">${BRAND.name}</span>
        <span class="brand-role">${BRAND.role}</span>
      </div>
      <span class="slide-count">${String(current).padStart(2,"0")} / ${String(total).padStart(2,"0")}</span>
    </div>`;
}

function buildCover(s, i, total){
  return `
    <div class="rail"></div>
    <div class="ghost-num">00</div>
    <div class="cover-inner">
      <div class="kicker">${s.kicker || ""}</div>
      <h1 class="headline">${fmt(s.headline)}</h1>
      <p class="sub">${fmt(s.sub)}</p>
      ${s.swipe ? `<div class="swipe">${s.swipe}<span class="arrow"></span></div>` : ""}
    </div>
    ${footerHTML(i+1, total)}`;
}

function buildContent(s, i, total, parity){
  return `
    <div class="rail ${parity === "even" ? "right" : ""}"></div>
    <div class="ghost-num">${s.num || String(i).padStart(2,"0")}</div>
    <div class="content-inner">
      <span class="num-tag">${s.tag || ""}</span>
      <h2 class="headline">${fmt(s.headline)}</h2>
      <div class="divider"></div>
      <p class="body-text">${fmt(s.body)}</p>
      ${s.callout ? `<div class="callout"><p>${fmt(s.callout)}</p></div>` : ""}
    </div>
    ${footerHTML(i+1, total)}`;
}

function buildCta(s, i, total){
  return `
    <div class="blob"></div>
    <div class="cta-inner">
      <h2 class="headline">${fmt(s.headline)}</h2>
      <p class="body-text">${fmt(s.body)}</p>
      ${s.handle ? `<div class="handle-pill">${s.handle}</div>` : ""}
      ${s.action ? `<div class="action-line">${s.action}</div>` : ""}
    </div>
    ${footerHTML(i+1, total)}`;
}

function render(){
  const stage = document.getElementById("stage");
  const total = SLIDES.length;
  stage.innerHTML = "";

  SLIDES.forEach((s, i) => {
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.dataset.index = i;

    const slide = document.createElement("div");
    slide.id = `slide-${i+1}`;
    slide.dataset.index = i;

    let inner = "";
    if(s.type === "cover"){
      slide.className = "slide s-cover";
      inner = buildCover(s, i, total);
    } else if(s.type === "cta"){
      slide.className = "slide s-cta";
      inner = buildCta(s, i, total);
    } else {
      const parity = i % 2 === 0 ? "odd" : "even";
      slide.className = `slide s-content ${parity}`;
      inner = buildContent(s, i, total, parity);
    }
    slide.innerHTML = inner;

    const label = document.createElement("div");
    label.className = "frame-label";
    label.textContent = `Slide ${i+1} of ${total} — ${s.type}`;

    frame.appendChild(slide);
    stage.appendChild(label);
    stage.appendChild(frame);
  });

  fitSlides();
}

/* ---------------------------------------------------------
   3. PREVIEW SCALING — keeps each .slide at native 1080x1350
   for export while shrinking the on-screen frame to fit.
--------------------------------------------------------- */
function fitSlides(){
  const scale = Math.min(1, (window.innerWidth - 48) / 1080);
  document.querySelectorAll(".frame").forEach(frame => {
    frame.style.width = 1080 * scale + "px";
    frame.style.height = 1350 * scale + "px";
    const slide = frame.querySelector(".slide");
    slide.style.transform = `scale(${scale})`;
  });
}
window.addEventListener("resize", fitSlides);

/* ---------------------------------------------------------
   4. EXPORT — html2canvas renders each .slide at its native
   1080x1350 box (transform on the node doesn't change its
   offsetWidth/offsetHeight, so capture stays full resolution).
--------------------------------------------------------- */
const setStatus = (msg) => document.getElementById("status").textContent = msg;

async function captureSlide(el){
  return html2canvas(el, {
    backgroundColor: "#050810",
    width: 1080,
    height: 1350,
    windowWidth: 1080,
    windowHeight: 1350,
    scale: 1,
  });
}

function downloadCanvas(canvas, filename){
  const link = document.createElement("a");
  link.download = filename;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function currentSlideEl(){
  // "current" = the slide nearest the vertical center of the viewport
  const slides = [...document.querySelectorAll(".slide")];
  const mid = window.scrollY + window.innerHeight / 2;
  let best = slides[0], bestDist = Infinity;
  slides.forEach(s => {
    const rect = s.closest(".frame").getBoundingClientRect();
    const center = rect.top + window.scrollY + rect.height / 2;
    const dist = Math.abs(center - mid);
    if(dist < bestDist){ bestDist = dist; best = s; }
  });
  return best;
}

async function exportCurrent(){
  setStatus("Rendering slide…");
  const el = currentSlideEl();
  const canvas = await captureSlide(el);
  downloadCanvas(canvas, `slide-${String(+el.dataset.index + 1).padStart(2,"0")}.png`);
  setStatus("Slide downloaded");
}

async function exportAllIndividually(){
  const slides = [...document.querySelectorAll(".slide")];
  for(let i = 0; i < slides.length; i++){
    setStatus(`Rendering ${i+1} / ${slides.length}…`);
    const canvas = await captureSlide(slides[i]);
    downloadCanvas(canvas, `slide-${String(i+1).padStart(2,"0")}.png`);
    await new Promise(r => setTimeout(r, 350)); // let the browser flush each download
  }
  setStatus("All slides downloaded");
}

async function exportAllAsZip(){
  const slides = [...document.querySelectorAll(".slide")];
  const zip = new JSZip();
  for(let i = 0; i < slides.length; i++){
    setStatus(`Rendering ${i+1} / ${slides.length}…`);
    const canvas = await captureSlide(slides[i]);
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    zip.file(`slide-${String(i+1).padStart(2,"0")}.png`, blob);
  }
  setStatus("Zipping…");
  const content = await zip.generateAsync({ type: "blob" });
  const link = document.createElement("a");
  link.download = "linkedin-carousel.zip";
  link.href = URL.createObjectURL(content);
  link.click();
  setStatus("ZIP downloaded");
}

document.getElementById("btn-export-current").addEventListener("click", () => exportCurrent().catch(e => setStatus("Error: " + e.message)));
document.getElementById("btn-export-all").addEventListener("click", () => exportAllIndividually().catch(e => setStatus("Error: " + e.message)));
document.getElementById("btn-export-zip").addEventListener("click", () => exportAllAsZip().catch(e => setStatus("Error: " + e.message)));

render();
</script>
</body>
</html>
